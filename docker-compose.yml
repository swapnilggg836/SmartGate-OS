version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartgate-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: smart_gate_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: smartgate-redis
    restart: always
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartgate-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      DATABASE_URL: "file:./dev.db" # Or "mysql://root:password123@mysql:3306/smart_gate_db"
      JWT_ACCESS_SECRET: "super-secret-access-key-2026"
      JWT_REFRESH_SECRET: "super-secret-refresh-key-2026"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smartgate-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
    depends_on:
      - backend

volumes:
  mysql_data:
